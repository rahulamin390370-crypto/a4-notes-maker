<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>A4 Notes Maker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Patrick+Hand&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background: #f1f5f9; color: #0f172a; padding-bottom: 50px; }
    .header { background: #0f172a; color: #fff; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    .brand { font-weight: 700; font-size: 1rem; }
    .balance-badge { background: #10b981; color: #fff; font-size: 0.75rem; padding: 5px 12px; border-radius: 20px; font-weight: 600; }
    .btn-login { background: #2563eb; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; cursor: pointer; }
    .container { padding: 14px; max-width: 480px; margin: 0 auto; }
    .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 14px; border: 1px solid #e2e8f0; }
    label { font-size: 0.78rem; font-weight: 600; color: #475569; display: block; margin-bottom: 6px; }
    textarea { width: 100%; height: 120px; border: 1.5px solid #cbd5e1; border-radius: 8px; padding: 10px; font-size: 0.88rem; outline: none; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    select, input { width: 100%; padding: 8px; border-radius: 6px; border: 1.5px solid #cbd5e1; font-size: 0.82rem; }
    .btn-main { width: 100%; background: #2563eb; color: #fff; border: none; padding: 13px; border-radius: 8px; font-size: 0.92rem; font-weight: 700; margin-top: 12px; cursor: pointer; }
    .pages-wrap { display: flex; flex-direction: column; gap: 16px; overflow-x: auto; margin-top: 10px; }
    .a4-box { background: #e2e8f0; padding: 8px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; }
    .page-title { font-size: 0.75rem; font-weight: 600; color: #64748b; margin-bottom: 4px; }
    .a4-sheet { width: 380px; height: 538px; background: #fffdf7; position: relative; padding: 40px 25px 30px 45px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); overflow: hidden; border-radius: 2px; }
    .a4-sheet.ruled::before { content: ''; position: absolute; top: 0; bottom: 0; left: 38px; width: 1.5px; background: #f87171; z-index: 2; }
    .a4-sheet.ruled { background-image: repeating-linear-gradient(transparent, transparent 25px, #cbd5e1 25px, #cbd5e1 26px); background-position: 0 25px; }
    .paper-text { position: relative; z-index: 3; font-size: 15px; line-height: 26px; white-space: pre-wrap; word-wrap: break-word; }
    .btn-print { background: #059669; color: #fff; border: none; padding: 11px; border-radius: 6px; font-weight: 600; width: 100%; margin-top: 12px; font-size: 0.85rem; cursor: pointer; }
    .ad-box { background: #fef3c7; border: 1px solid #fde68a; border-radius: 8px; padding: 12px; text-align: center; }
    .btn-ad { background: #d97706; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; font-size: 0.78rem; margin-top: 6px; cursor: pointer; }
    .packs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
    .pack { border: 1px solid #cbd5e1; padding: 8px 4px; text-align: center; border-radius: 6px; cursor: pointer; }
    .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 200; padding: 14px; }
    .modal-content { background: #fff; width: 100%; max-width: 320px; border-radius: 10px; padding: 18px; }
    .modal-content input { margin-bottom: 8px; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #0f172a; color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 0.8rem; display: none; z-index: 300; }
  </style>
</head>
<body>

  <header class="header">
    <div class="brand">📝 A4 Notes Maker</div>
    <div style="display: flex; gap: 8px; align-items: center;">
      <span class="balance-badge" id="balBadge">Balance: 4 Pages</span>
      <button class="btn-login" id="navAuthBtn" onclick="toggleAuthModal()">Login</button>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <label>Paste Assignment Text:</label>
      <textarea id="textInput" placeholder="Type or paste your notes here..."></textarea>

      <div class="grid">
        <div>
          <label>Font:</label>
          <select id="fontFamily">
            <option value="'Patrick Hand', cursive">Patrick Hand</option>
            <option value="'Caveat', cursive">Caveat</option>
          </select>
        </div>
        <div>
          <label>Ink Color:</label>
          <select id="fontColor">
            <option value="#0d3b66">Royal Blue</option>
            <option value="#1e293b">Black Ink</option>
          </select>
        </div>
      </div>

      <div class="grid">
        <div>
          <label>Paper Style:</label>
          <select id="paperType">
            <option value="ruled">Ruled (Lines)</option>
            <option value="plain">Plain White</option>
          </select>
        </div>
        <div>
          <label>Font Size:</label>
          <input type="number" id="fontSize" value="16" min="12" max="22" />
        </div>
      </div>

      <button class="btn-main" onclick="onGenerateClick()">✨ Create Handwritten Pages</button>
    </section>

    <section class="card" id="outputCard" style="display: none;">
      <h3 style="font-size: 0.9rem; margin-bottom: 10px;">Generated A4 Sheets</h3>
      <div class="pages-wrap" id="sheetsWrap"></div>
      <button class="btn-print" onclick="window.print()">📥 Print / Save as PDF (Free)</button>
    </section>

    <section class="card">
      <h3 style="font-size: 0.9rem; margin-bottom: 8px;">Recharge & Balance</h3>
      <div class="ad-box">
        <div style="font-weight: 600; font-size: 0.85rem; color: #92400e;">Watch Video Ad</div>
        <p style="font-size: 0.75rem; color: #b45309;">Get +2 Pages free</p>
        <button class="btn-ad" onclick="onWatchAd()">Watch Ad (+2 Pages)</button>
      </div>

      <div class="packs">
        <div class="pack" onclick="addPack(1, 3)"><strong>₹1</strong><div style="font-size: 0.7rem; color: #64748b;">3 Pages</div></div>
        <div class="pack" onclick="addPack(9, 50)"><strong>₹9</strong><div style="font-size: 0.7rem; color: #64748b;">50 Pages</div></div>
        <div class="pack" onclick="addPack(19, 200)"><strong>₹19</strong><div style="font-size: 0.7rem; color: #64748b;">200 Pages</div></div>
      </div>
    </section>
  </main>

  <div class="modal" id="loginModal">
    <div class="modal-content">
      <h3 style="font-size: 0.95rem; margin-bottom: 10px;">Account Login</h3>
      <input type="email" id="userEmail" placeholder="Email Address" />
      <input type="password" id="userPass" placeholder="Password" />
      <button class="btn-main" style="margin-top: 4px;" onclick="onLoginSubmit()">Login / Sign Up</button>
      <button style="width: 100%; border: none; background: none; margin-top: 8px; color: #64748b; font-size: 0.8rem;" onclick="toggleAuthModal()">Cancel</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    var balance = 4;
    var loggedInUser = null;

    function toast(text) {
      var t = document.getElementById('toast');
      t.innerText = text;
      t.style.display = 'block';
      setTimeout(function() { t.style.display = 'none'; }, 2500);
    }

    function syncUI() {
      document.getElementById('balBadge').innerText = 'Balance: ' + balance + ' Pages';
      var btn = document.getElementById('navAuthBtn');
      if (loggedInUser) {
        btn.innerText = loggedInUser;
      } else {
        btn.innerText = 'Login';
      }
    }

    function toggleAuthModal() {
      var m = document.getElementById('loginModal');
      m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
    }

    function onLoginSubmit() {
      var email = document.getElementById('userEmail').value.trim();
      var pass = document.getElementById('userPass').value.trim();
      if (!email || !pass) {
        toast('Please enter email and password');
        return;
      }
      loggedInUser = email.split('@')[0];
      toggleAuthModal();
      syncUI();
      toast('Welcome, ' + loggedInUser + '!');
    }

    function onWatchAd() {
      toast('Playing sponsored ad...');
      setTimeout(function() {
        balance += 2;
        syncUI();
        toast('Ad reward: +2 Pages added!');
      }, 1000);
    }

    function addPack(price, pages) {
      if (!loggedInUser) {
        toast('Please login first to protect your balance');
        toggleAuthModal();
        return;
      }
      balance += pages;
      syncUI();
      toast('Added ' + pages + ' Pages successfully!');
    }

    function onGenerateClick() {
      var text = document.getElementById('textInput').value.trim();
      if (!text) {
        toast('Please paste your text first!');
        return;
      }

      var font = document.getElementById('fontFamily').value;
      var ink = document.getElementById('fontColor').value;
      var style = document.getElementById('paperType').value;
      var size = document.getElementById('fontSize').value + 'px';

      // Split text into chunks (~450 characters per A4 page view)
      var chunks = [];
      var remaining = text;
      while (remaining.length > 0) {
        chunks.push(remaining.substring(0, 450));
        remaining = remaining.substring(450);
      }

      var required = chunks.length;
      if (balance < required) {
        toast('Need ' + required + ' Pages, Balance: ' + balance + '. Watch ad or recharge.');
        return;
      }

      balance -= required;
      syncUI();

      var wrap = document.getElementById('sheetsWrap');
      wrap.innerHTML = '';

      for (var i = 0; i < chunks.length; i++) {
        var outer = document.createElement('div');
        outer.className = 'a4-box';

        var title = document.createElement('div');
        title.className = 'page-title';
        title.innerText = 'Page ' + (i + 1) + ' of ' + required;

        var sheet = document.createElement('div');
        sheet.className = 'a4-sheet ' + style;

        var p = document.createElement('div');
        p.className = 'paper-text';
        p.style.fontFamily = font;
        p.style.color = ink;
        p.style.fontSize = size;
        p.innerText = chunks[i];

        sheet.appendChild(p);
        outer.appendChild(title);
        outer.appendChild(sheet);
        wrap.appendChild(outer);
      }

      var outCard = document.getElementById('outputCard');
      outCard.style.display = 'block';
      outCard.scrollIntoView({ behavior: 'smooth' });
      toast('Pages generated successfully!');
    }
  </script>
</body>
</html>
